name: Release

on:
  push:
    tags: ['v*']
  # orchestrator（aster-lang-platform/release-train.yml）入口：dispatch 只创建并
  # push tag（用 CROSS_REPO_TOKEN，PAT 才能让 tag-push 再触发 publish——GITHUB_TOKEN
  # 推的 tag 不会触发 workflow）。真正 publish 仍只走下面的 tag-push 路径，保留
  # tag==version gate 与既有发布语义。详见 ADR 0023 阶段2。
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（不含 v 前缀），须等于 build.gradle.kts 的 version'
        required: true
        type: string
      artifactIds:
        description: 'release-plan 的 artifact id 列表（逗号分隔，审计用）'
        required: false
        type: string
      trainId:
        description: 'release train 标识（审计用）'
        required: false
        type: string
      forceTests:
        description: '发布 run 跑完整测试而不要求 main CI 已通过（ADR 0053 修订 A2 的逃生口）'
        required: false
        type: boolean
        default: false

# dispatch(vX) 与 tag-push(vX) 用同一 concurrency group（inputs.version 不含 v 前缀，
# 补 format 成 vX 对齐 ref_name），串行化同版本的 create-tag 与 publish。
concurrency:
  group: release-${{ github.repository }}-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  # dispatch 路径：仅创建 tag（用 PAT），让既有 tag-push publish 复用。
  create-tag:
    # 仅允许从默认分支 dispatch，避免给某个 version 恰好匹配的 feature 分支 HEAD 打 release tag。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      # catalog-derived version（ADR 0023 §9）：先 checkout platform 并 publishToMavenLocal，
      # 本仓 Gradle 才能解析 catalog 派生的 project version。与 core/truffle/runtime/hi/locales 同构。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'temurin' }
      - name: Bootstrap version catalog to Maven Local
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal
      - name: Create & push release tag
        env:
          VERSION: ${{ inputs.version }}
          FORCE_TESTS: ${{ inputs.forceTests }}
        run: |
          RESOLVED=$(./gradlew -q properties | sed -n 's/^version: //p' | head -n1)
          if [ "$VERSION" != "$RESOLVED" ]; then
            echo "::error::dispatch version ($VERSION) != Gradle-resolved catalog version ($RESOLVED)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n1 "$TAG"); HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              # ADR 0053 修订 A2：tag 已在本 commit 上时 dispatch 是 no-op，tag 消息不会再变；本次要求 forceTests 而已有
              # tag 不带标记，就明确失败，不让 forceTests 被静默忽略。
              if [ "$FORCE_TESTS" = "true" ] && ! git cat-file -p "refs/tags/$TAG" | grep -qxF "release-gate: force-tests"; then
                echo "::error::$TAG 已存在但不带 force-tests 标记，本次 forceTests=true 不会生效。该版本尚未发布时：删除远端 tag（git push origin :refs/tags/$TAG）后重新 dispatch；或让 main CI 变绿后重跑该 tag 的 publish run。"; exit 1
              fi
              echo "::notice::$TAG already on this commit → no-op (idempotent)"; exit 0
            fi
            echo "::error::$TAG exists but points to $TAG_SHA, not HEAD $HEAD_SHA"; exit 1
          fi
          # ADR 0053 修订 A2：forceTests 时打 annotated tag，消息带标记，tag-push 的发布 run 据此跑完整测试。
          if [ "$FORCE_TESTS" = "true" ]; then
            git tag -a "$TAG" -m "release-gate: force-tests"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

  publish:
    # tag-push 路径（含 orchestrator create-tag 推的 tag）才真正发布。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # ADR 0053 修订 A2：main CI 门禁读本仓的 CI run 与 job。
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # ADR 0053 修订 A2：发布的 commit 必须已在 main CI 上通过，发布 run 不再重跑测试。
      # 必需 job 见 .github/main-ci-gate.json；tag 带「release-gate: force-tests」时门禁跳过、本 run 跑完整测试。
      - name: Require main CI green for this commit
        id: ci-gate
        uses: aster-cloud/aster-lang-platform/.github/actions/require-main-ci-green@main

      # 共享版本目录（ADR 0012/0023 §9）：本仓 version=catalog-derived，须先 platform
      # publishToMavenLocal 才能配置期解析 asterLibs catalog。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Bootstrap version catalog to Maven Local
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      - name: Verify tag matches catalog-derived version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          RESOLVED=$(./gradlew -q properties | sed -n 's/^version: //p' | head -n1)
          if [ "$TAG_VERSION" != "$RESOLVED" ]; then
            echo "Error: Tag version ($TAG_VERSION) != Gradle-resolved catalog version ($RESOLVED)"
            exit 1
          fi

      # 测试已在 main CI 上对本 commit 通过（上面的门禁），这里只构建与打包：check 里除 test 之外的
      # 校验任务照跑。force-tests 时跑完整 build（含 test）。
      - name: Build (tests ran in main CI)
        env:
          FORCE_TESTS: ${{ steps.ci-gate.outputs.force-tests }}
        run: |
          if [ "$FORCE_TESTS" = "true" ]; then ./gradlew build; else ./gradlew build -x test; fi

      # jar 级冒烟：主 jar 存在、版本与 tag 一致、含必需条目。测试跑的是 class 目录，不看 jar。
      - name: Verify jar contents
        uses: aster-cloud/aster-lang-platform/.github/actions/verify-jar-contents@main
        with:
          jars: build/libs/*.jar
          version: ${{ github.ref_name }}
          entries: |
            ^io/aster/.*\.class$

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
