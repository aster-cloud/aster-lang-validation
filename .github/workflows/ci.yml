name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：本 CI 仅做 checkout + 漂移 gate + 构建测试，无任何写操作（推 commit/tag、发 release、
# 推镜像、评论 PR、上传 SARIF、云 OIDC 均无），故顶层收敛为只读 contents: read。
# 跨仓 checkout 用独立 PAT（CROSS_REPO_TOKEN），不依赖 GITHUB_TOKEN，无需额外写权限。
permissions:
  contents: read

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# 该仓 CI 无发布/部署副作用（release 是独立 workflow），故可直接 cancel 过时 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 防漂移 gate（ADR 0023 阶段6）。本仓无 platform 依赖，为 gate 单独 checkout platform。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Release-plan drift gate
        run: |
          python3 aster-lang-platform/scripts/release-plan/check-artifact.py \
            --plan aster-lang-platform/release-plan.json \
            --artifact validation:maven --repo-root .

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # catalog bootstrap（ADR 0023 §9）：本仓 version=catalog-derived，settings 从
      # mavenLocal 解析 catalog → 须先把已 checkout 的 platform publishToMavenLocal，
      # 否则 ./gradlew 配置期解析不到 asterLibs catalog（原 issue #6 deferred 的顾虑，本次消解）。
      - name: Bootstrap version catalog to Maven Local
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      - name: Build & Test
        run: ./gradlew build
