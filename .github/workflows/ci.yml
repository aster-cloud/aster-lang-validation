name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 防漂移 gate（ADR 0023 阶段6）。本仓无 platform 依赖，为 gate 单独 checkout platform。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Release-plan drift gate
        run: |
          python3 aster-lang-platform/scripts/release-plan/check-artifact.py \
            --plan aster-lang-platform/release-plan.json \
            --artifact validation:maven --repo-root .

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # catalog bootstrap（ADR 0023 §9）：本仓 version=catalog-derived，settings 从
      # mavenLocal 解析 catalog → 须先把已 checkout 的 platform publishToMavenLocal，
      # 否则 ./gradlew 配置期解析不到 asterLibs catalog（原 issue #6 deferred 的顾虑，本次消解）。
      - name: Bootstrap version catalog to Maven Local
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      - name: Build & Test
        run: ./gradlew build
